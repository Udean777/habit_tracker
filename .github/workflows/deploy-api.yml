name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
    inputs:
      migrations:
        description: "Neon DB migrations mode"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - always
          - skip

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate Neon & Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Ensure deploy runs on main
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::API deploy only runs from main, not ${{ github.ref_name }}"
            exit 1
          fi

      - name: Detect changed backend paths
        id: changes
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.migrations || 'auto' }}"
          SHOULD_MIGRATE="false"

          if [ "$MODE" = "always" ]; then
            SHOULD_MIGRATE="true"
          elif [ "$MODE" = "skip" ]; then
            SHOULD_MIGRATE="false"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                DIFF_FILES=$(git diff --name-only HEAD~1 HEAD)
              else
                DIFF_FILES="apps/api/src/db/migrations/"
              fi
            else
              DIFF_FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            fi

            echo "Changed files:"
            echo "$DIFF_FILES"

            if echo "$DIFF_FILES" | grep -Eq '^apps/api/src/db/(migrations/|migrate\.ts)'; then
              SHOULD_MIGRATE="true"
            fi
          fi

          echo "should_migrate=$SHOULD_MIGRATE" >> "$GITHUB_OUTPUT"
          echo "Run Neon migrations: $SHOULD_MIGRATE (mode: $MODE)"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Checks
        run: |
          bun run typecheck
          bun run lint
          bun run test

      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are required"
            exit 1
          fi

      - name: Run Neon DB migrations
        if: steps.changes.outputs.should_migrate == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::NEON_DATABASE_URL secret is required to run migrations"
            exit 1
          fi
          bun run --filter @habit/api db:migrate

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --filter @habit/api deploy

      - name: Smoke test production health & DB
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "EXPO_PUBLIC_API_URL secret not set; skipping smoke test"
            exit 0
          fi
          HEALTH_URL="${EXPO_PUBLIC_API_URL%/}/health?db=1"
          echo "Checking $HEALTH_URL"
          curl -fsS --retry 3 --retry-delay 2 "$HEALTH_URL"
          echo ""
