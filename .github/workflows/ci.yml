name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'

  android-release-dry-run:
    name: Android Release Build (Dry Run)
    needs: [check, changes]
    if: >-
      always() &&
      needs.check.result == 'success' &&
      (github.event_name == 'push' || needs.changes.outputs.mobile == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: bun install --frozen-lockfile

      - name: Verify native prebuilt libs
        run: |
          test -s node_modules/@shopify/react-native-skia/libs/android/arm64-v8a/libskia.a
          test -s node_modules/@shopify/react-native-skia/libs/android/armeabi-v7a/libskia.a

      - name: Build unsigned release AAB
        working-directory: apps/mobile/android
        run: ./gradlew bundleRelease

      - name: Verify AAB output
        run: test -s apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
