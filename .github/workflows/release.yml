name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type (calculated from the latest v* tag)"
        required: true
        default: minor
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: "Custom version (only when bump type is custom, e.g. 1.2.0)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Ensure the dispatch runs on main
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Release only runs from main, not ${{ github.ref_name }}"
            exit 1
          fi

      - name: Calculate next version
        id: version
        run: |
          git fetch --tags --force

          LATEST_VERSION=$(
            git tag -l "v*" \
              | sed -E 's/^v//; s/\+.*$//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -u -t. -k1,1n -k2,2n -k3,3n \
              | tail -n 1
          )
          BUMP_TYPE="${{ inputs.bump_type }}"
          CUSTOM_INPUT="${{ inputs.custom_version }}"

          echo "Latest version: '${LATEST_VERSION:-none}' / bump: '$BUMP_TYPE'"

          if [ "$BUMP_TYPE" = "custom" ]; then
            if [ -z "$CUSTOM_INPUT" ]; then
              echo "::error::custom_version is required when the bump type is custom"
              exit 1
            fi
            CLEAN_VERSION="${CUSTOM_INPUT#v}"
          elif [ -z "$LATEST_VERSION" ]; then
            CLEAN_VERSION="1.0.0"
          else
            IFS="." read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            case "$BUMP_TYPE" in
              patch) PATCH=$((PATCH + 1)) ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              *) PATCH=$((PATCH + 1)) ;;
            esac
            CLEAN_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          if ! echo "$CLEAN_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$CLEAN_VERSION' is not a valid MAJOR.MINOR.PATCH version"
            exit 1
          fi

          NEWEST=$(printf '%s\n%s\n' "$LATEST_VERSION" "$CLEAN_VERSION" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
          if [ -n "$LATEST_VERSION" ] && [ "$NEWEST" != "$CLEAN_VERSION" ]; then
            echo "::error::$CLEAN_VERSION must be newer than the latest release $LATEST_VERSION"
            exit 1
          fi

          IFS="." read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
          # Play requires a versionCode that never repeats; deriving it from the
          # version keeps it monotonic without a separate counter.
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))

          echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Release v$CLEAN_VERSION (versionCode $VERSION_CODE)"

      - name: Verify tag does not exist
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - name: Checks
        run: |
          bun run typecheck
          bun run lint
          bun run test

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to build a debug-signed release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > apps/mobile/android/app/release.keystore
          test -s apps/mobile/android/app/release.keystore

      - name: Set version in the native project
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ steps.version.outputs.version_code }}/" apps/mobile/android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${{ steps.version.outputs.version }}\"/" apps/mobile/android/app/build.gradle
          grep -E "versionCode|versionName" apps/mobile/android/app/build.gradle

      - name: Build AAB and APK
        working-directory: apps/mobile/android
        env:
          GLIMKIN_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GLIMKIN_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GLIMKIN_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Gradle reads task names to decide on ABI splits, so the bundle and the
          # APKs must be separate invocations: bundling disables the splits.
          PROPS=(
            -PGLIMKIN_UPLOAD_STORE_FILE=release.keystore
            -PGLIMKIN_UPLOAD_STORE_PASSWORD="$GLIMKIN_UPLOAD_STORE_PASSWORD"
            -PGLIMKIN_UPLOAD_KEY_ALIAS="$GLIMKIN_UPLOAD_KEY_ALIAS"
            -PGLIMKIN_UPLOAD_KEY_PASSWORD="$GLIMKIN_UPLOAD_KEY_PASSWORD"
          )
          ./gradlew bundleRelease "${PROPS[@]}"
          ./gradlew assembleRelease "${PROPS[@]}"

      - name: Collect artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab "dist/glimkin-$VERSION.aab"
          cp apps/mobile/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/glimkin-$VERSION-arm64-v8a.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk "dist/glimkin-$VERSION-armeabi-v7a.apk"

          for f in dist/*; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
          done

          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify release signing
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"

          for apk in dist/*.apk; do
            echo "== $apk"
            "$ZIPALIGN" -c -v 4 "$apk" > /dev/null

            CERTS=$("$APKSIGNER" verify -v --print-certs "$apk")
            echo "$CERTS"

            if echo "$CERTS" | grep -qi "CN=Android Debug"; then
              echo "::error::$apk is signed with the debug certificate"
              exit 1
            fi
            # v2 is mandatory from Android 11; v3 lets the key be rotated.
            echo "$CERTS" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
            echo "$CERTS" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"
          done

          for aab in dist/*.aab; do
            echo "== $aab"
            jarsigner -verify "$aab" | grep -q "jar verified"
          done

      - name: Push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Glimkin ${{ steps.version.outputs.tag }}
          files: |
            dist/*.aab
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
